# Structured content request.
#
# THE FIELD LABELS BELOW ARE A MACHINE CONTRACT. GitHub renders a submitted
# form as "### <label>" followed by the value, and the field ids never appear
# in the issue body. Orchard's scripts/ingest-curriculum-requests.mjs parses
# these exact headings (see FIELD_LABELS there) to turn this issue into an
# authoring proposal with no human retyping it. Rename a label here and the
# ingest stops recognising the field, so change both in the same commit.

name: Request new curriculum content
description: Propose a module for the Project 42 learning paths.
title: "Content Request: "
labels: ["content-request", "content", "enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Requests filed here are read automatically and become authoring
        proposals. Fill every required field: an incomplete request is
        reported and skipped rather than guessed at.

  - type: input
    id: module-title
    attributes:
      label: Module title
      description: The title the module would carry in the catalog.
      placeholder: Advanced Multi-Agent Orchestration & Topologies
    validations:
      required: true

  - type: dropdown
    id: learning-path
    attributes:
      label: Learning path
      description: The existing path this module belongs in.
      options:
        - ai-literacy-and-mental-models
        - developer-and-practitioner-ai
        - agentic-systems-and-mcp
        - rag-and-fine-tuning-engineering
        - self-hosted-and-aiops
        - ai-security-and-governance
        - anthropic-claude-practice
        - openai-practice
        - google-gemini-practice
        - providers-in-practice
        - ai-foundations
        - reliable-agent-workflows
        - agentic-ai-literacy
        - self-hosted-model-operations
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: Level
      options:
        - beginner
        - intermediate
        - advanced
      default: 1
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what the module teaches.
      placeholder: Architecting robust multi-agent systems with hierarchical delegation, memory boundaries, and consensus ensembles.
    validations:
      required: true

  - type: textarea
    id: objectives
    attributes:
      label: Learning objectives
      description: One objective per line. Three or more is the useful minimum.
      placeholder: |
        Implement supervisor, router, and peer-to-peer topologies
        Enforce memory boundaries between agents
        Construct critique and verification ensembles
    validations:
      required: true

  - type: dropdown
    id: estimated-minutes
    attributes:
      label: Estimated duration (minutes)
      options:
        - "15"
        - "20"
        - "25"
        - "30"
        - "45"
        - "60"
      default: 2
    validations:
      required: false

  - type: input
    id: audience
    attributes:
      label: Intended audience
      description: Who this module is for. Optional.
      placeholder: AI Engineers, Systems Architects, and Technical Leads
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Project 42 is community-supported open source. Requests are triaged
        publicly and carry no response-time guarantee. When a requested module
        is published, this issue is commented on and closed automatically.
